<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NF Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NF Store: perfumes árabes, iPhones e importados originais no Rio de Janeiro. Entregamos para todo o Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: e-commerce premium — faixa de aviso, header branco fixo, hero escuro em carrossel (texto à esquerda, foto 4:5 à direita), faixa de confiança, categorias com foto, ranking dos árabes, catálogo em grade 2→4, sobre a loja, rodapé escuro */
:root{
  --noir:#0f0e0d; --noir-2:#1b1917; --noir-line:rgba(255,255,255,.1);
  --gold:#b48c4c; --gold-ink:#7d5f2c; --gold-soft:#efe5d3;
  --bg:#fafaf9; --surface:#ffffff; --fg:#151311; --fg-2:#46423d; --muted:#7a746d; --line:rgba(21,19,17,.1);
  --ok:#2e6b47; --warn:#9a5b12; --bad:#a3352b;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1a1816; --fg:#f2eee8; --fg-2:#cfc8bf; --muted:#9a9289; --line:rgba(255,255,255,.1);
  --gold-ink:#d2ad6c; --gold-soft:#2a2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1a1816; --fg:#f2eee8; --fg-2:#cfc8bf; --muted:#9a9289; --line:rgba(255,255,255,.1);
  --gold-ink:#d2ad6c; --gold-soft:#2a2219; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--noir)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.serif{font-family:var(--f-display);font-weight:400;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Aviso + header */
.notice{background:var(--noir);color:#d9d2c7;font-size:13px}
.notice .wrap{display:flex;justify-content:center;gap:28px;padding-block:8px;flex-wrap:wrap;text-align:center}
.notice span:not(:first-child){display:none}
@media (min-width:760px){.notice span:not(:first-child){display:inline}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);transition:background-color .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease)}
.top.over{background:transparent;border-color:transparent;color:#f3efe8;-webkit-backdrop-filter:none;backdrop-filter:none}
.top.over .icobtn,.top.over .nav a{color:#f3efe8}
.top.over .icobtn:hover{background:rgba(255,255,255,.1)}
.top.over .nav a:hover{border-color:#f3efe8}
.top .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:40px;height:40px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.01em}
.nav{display:flex;justify-content:center;gap:28px;font-size:14px}
.nav a{text-decoration:none;color:var(--fg-2);padding:6px 0;border-bottom:1px solid transparent;transition:color .15s var(--ease),border-color .15s var(--ease)}
.nav a:hover{color:var(--fg);border-color:var(--fg)}
.tools{display:flex;gap:4px;align-items:center}
.icobtn{position:relative;background:none;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icobtn:hover{background:var(--line)}
.count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#16120c;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.count[data-n="0"]{display:none}
.menubtn{display:none}
@media (max-width:860px){.nav{display:none}.menubtn{display:grid}.top .wrap{grid-template-columns:auto 1fr auto}.brand{justify-self:start}}
.searchbar{border-top:1px solid var(--line);background:var(--surface)}
.searchbar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.searchbar input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:8px 0;outline:none}
.sheet{border-top:1px solid var(--line);background:var(--surface)}
.sheet .wrap{display:flex;flex-direction:column;padding-block:8px}
.sheet a{padding:12px 0;text-decoration:none;border-bottom:1px solid var(--line);font-size:16px}
.sheet a:last-child{border:0}

/* Hero */
.hero{background:var(--noir);color:#f3efe8;position:relative;overflow:hidden;margin-top:-69px;padding-top:69px}
.slides{display:grid}
.slide{grid-area:1/1;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:56px 72px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.slide.on{opacity:1;visibility:visible;transition:opacity .5s var(--ease) .3s,visibility 0s}
.slide .kicker{font-size:14px;color:var(--gold)}
.slide h1{font-family:var(--f-display);font-size:clamp(44px,6.4vw,84px);line-height:.98;margin:14px 0 18px}
.slide h1 i{color:var(--gold)}
.slide p{color:#bdb5aa;max-width:44ch;margin:0 0 28px;font-size:16px}
.slide .ctas{display:flex;gap:12px;flex-wrap:wrap}
.slide figure{margin:0;justify-self:end;width:min(440px,100%);aspect-ratio:4/5;border-radius:6px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.8);max-width:100%}
.slide figure img{width:100%;height:100%;object-fit:cover;display:block}
.slide.on figure img{animation:kb 9s var(--ease) both}
@keyframes kb{from{transform:scale(1.07)}}
.slide.on .kicker,.slide.on h1,.slide.on p,.slide.on .ctas{animation:up .7s var(--ease) both}
.slide.on h1{animation-delay:.38s}.slide.on p{animation-delay:.46s}.slide.on .ctas{animation-delay:.54s}.slide.on .kicker{animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hero-nav{position:absolute;left:0;right:0;bottom:22px}
.hero-nav .wrap{display:flex;gap:16px;align-items:center}
.dots{display:flex;gap:8px}
.dots button{position:relative;width:44px;height:3px;border:0;border-radius:2px;background:rgba(255,255,255,.22);padding:0;overflow:hidden}
.dots button::after{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left}
.dots button[aria-current="true"]::after{transform:scaleX(1)}
.hero.run .dots button[aria-current="true"]::after{animation:fill 7s linear both}
@keyframes fill{from{transform:scaleX(0)}}
.arrows{margin-left:auto;display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--noir-line);background:transparent;color:#f3efe8;display:grid;place-items:center}
.arrows button:hover{background:rgba(255,255,255,.08)}
@media (max-width:760px){.slide{grid-template-columns:1fr;gap:28px;padding-block:32px 72px}.slide figure{justify-self:stretch;width:100%;aspect-ratio:1/1}.slide h1{font-size:46px}.arrows{display:none}}

/* Botões */
.btn{border:1px solid transparent;border-radius:999px;padding:13px 24px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),transform .1s}
.btn:active{transform:scale(.98)}
.btn-light{background:#f3efe8;color:#141210}
.btn-light:hover{background:#fff}
.btn-outline-light{border-color:rgba(255,255,255,.3);color:#f3efe8;background:transparent}
.btn-outline-light:hover{border-color:#f3efe8}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-dark:hover{opacity:.9}
.btn-wa{background:#1f8f4e;color:#fff}
.btn-wa:hover{background:#1a7d44}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Marcas em movimento */
.ticker{background:var(--noir);color:#a89f93;border-top:1px solid var(--noir-line);overflow:hidden;white-space:nowrap}
.ticker .row{display:inline-flex;gap:48px;padding:16px 0;animation:tick 40s linear infinite;font-family:var(--f-display);font-size:26px}
.ticker:hover .row{animation-play-state:paused}
.ticker .row span{display:inline-flex;align-items:center;gap:48px}
.ticker .row span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
@keyframes tick{to{transform:translateX(-50%)}}
.spec{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.fly{position:fixed;z-index:95;border-radius:6px;object-fit:cover;pointer-events:none;box-shadow:0 20px 40px -10px rgba(0,0,0,.4)}
.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.25)}}
/* Perfume em destaque */
.feature{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--noir);color:#f3efe8;border-radius:8px;overflow:hidden;margin-top:72px}
.feature figure{margin:0;min-height:100%;max-width:100%}
.feature figure img{width:100%;height:100%;object-fit:cover;display:block}
.feature .txt{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.feature h2{font-family:var(--f-display);font-size:clamp(40px,5vw,64px);line-height:1}
.feature p{color:#bdb5aa;margin:0;max-width:42ch}
.pyramid{display:grid;gap:0;border-top:1px solid var(--noir-line)}
.pyramid div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--noir-line)}
.pyramid dt{font-family:var(--f-mono);font-size:12px;color:var(--gold);padding-top:2px}
.pyramid dd{margin:0}
@media (max-width:800px){.feature{grid-template-columns:1fr}.feature figure{aspect-ratio:4/5}}
.handle{display:none}
@media (max-width:600px){
  .scrim.sheet-mode{align-items:flex-end}
  .drawer{width:100%;height:90vh;height:90dvh;border-radius:16px 16px 0 0;animation:sheet .32s var(--ease);padding-right:0}
  .handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  .pinfo .actions{position:sticky;bottom:0;background:var(--bg);margin-inline:-20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:2}
}
@keyframes sheet{from{transform:translateY(40%);opacity:.4}}

/* Faixa de confiança */
.trust{border-bottom:1px solid var(--line);background:var(--surface)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-block:20px}
.trust div{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--fg-2)}
.trust b{display:block;color:var(--fg);font-weight:500}
.trust small{font-size:13px;color:var(--muted)}
.trust .ico{color:var(--gold-ink);width:22px;height:22px}
@media (max-width:860px){.trust .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.trust .wrap{grid-template-columns:1fr}}

/* Seções */
.sec{padding-block:64px 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display);font-size:clamp(32px,4vw,44px);line-height:1.05}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.link{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--fg);padding-bottom:2px;font-size:14px;font-weight:500;background:none;border-top:0;border-left:0;border-right:0}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:4/5;text-decoration:none;color:#fff;display:block;background:var(--noir);max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.tile:hover img{transform:scale(1.03)}
.tile span{position:absolute;inset:auto 0 0 0;padding:56px 20px 20px;background:linear-gradient(to top,rgba(10,9,8,.85),rgba(10,9,8,0));display:flex;justify-content:space-between;align-items:end;gap:12px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.tile small{font-size:13px;opacity:.85}
@media (max-width:760px){.cats{grid-template-columns:1fr 1fr}.cats .tile:last-child{grid-column:1/-1;aspect-ratio:16/9}.tile b{font-size:24px}}

/* Ranking */
.rank{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.rk{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:border-color .15s var(--ease)}
.rk:hover{border-color:var(--fg)}
.rk .ph{aspect-ratio:4/5;background:var(--noir);max-width:100%}
.rk .ph img{width:100%;height:100%;object-fit:cover;display:block}
.rk .b{padding:14px 16px 16px;display:grid;gap:4px}
.rk .pos{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--gold-ink)}
.rk .nm{font-weight:500}
.rk .meta{font-size:13px;color:var(--muted)}

/* Catálogo */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters .sp{flex:1}
select.sort{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1060px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 20px}}
.card{display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--noir);max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card:hover .ph img{transform:scale(1.03)}
.badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#151311}
.badge.dark{background:rgba(15,14,13,.85);color:#f3efe8}
.badge.sale{left:auto;right:10px;background:var(--gold);color:#16120c}
.quick{position:absolute;left:10px;right:10px;bottom:10px;border:0;border-radius:999px;background:rgba(255,255,255,.95);color:#151311;padding:10px;font-weight:500;font-size:14px;opacity:0;transform:translateY(6px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.card:hover .quick,.quick:focus-visible{opacity:1;transform:none}
@media (hover:none){.quick{display:none}}
.card .nm{font-size:15px;font-weight:500;line-height:1.35}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .now{font-size:16px;font-weight:600}
.price .old{font-size:13px;color:var(--muted);text-decoration:line-through}
.pix{font-size:13px;color:var(--ok)}
.card.isout .ph img{filter:grayscale(.6);opacity:.7}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}

/* Sobre */
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding-block:72px}
.about figure{margin:0;border-radius:6px;overflow:hidden;aspect-ratio:1;max-width:100%}
.about figure img{width:100%;height:100%;object-fit:cover}
.about h2{font-family:var(--f-display);font-size:clamp(34px,4.4vw,52px);line-height:1.02;margin-bottom:16px}
.about p{color:var(--fg-2);max-width:48ch}
.about ul{list-style:none;padding:0;margin:20px 0 28px;display:grid;gap:10px}
.about li{display:flex;gap:10px;align-items:center;color:var(--fg-2)}
.about li .ico{color:var(--gold-ink)}
@media (max-width:760px){.about{grid-template-columns:1fr;gap:28px;padding-block:48px}}

/* Rodapé */
.foot{background:var(--noir);color:#bdb5aa;font-size:14px;margin-top:40px}
.foot .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding-block:48px 28px}
.foot b{color:#f3efe8;font-weight:500;display:block;margin-bottom:12px}
.foot a{text-decoration:none;color:#bdb5aa}
.foot a:hover{color:#f3efe8}
.foot .col{display:flex;flex-direction:column;gap:8px}
.foot .legal{border-top:1px solid var(--noir-line);grid-column:1/-1;padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#8a8279}
@media (max-width:760px){.foot .wrap{grid-template-columns:1fr 1fr}.foot .wrap>div:first-child{grid-column:1/-1}}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:56px;height:56px;border-radius:50%;background:#1f8f4e;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);text-decoration:none}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(12,11,10,.5);z-index:70;display:flex;justify-content:flex-end;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateX(24px);opacity:.3}}
.drawer{background:var(--bg);width:min(440px,100%);height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:rise .25s var(--ease)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-family:var(--f-display);font-size:28px}
.drawer .body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.drawer footer{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.line-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.line-item img{width:64px;height:80px;border-radius:4px;object-fit:cover;background:var(--noir)}
.line-item .nm{font-weight:500;font-size:14px;line-height:1.3}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{background:none;border:0;width:34px;height:34px;font-size:17px}
.qty span{min-width:24px;text-align:center;font-weight:500}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:14px}
.totals .big{font-size:18px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--fg-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.seg{display:flex;gap:8px;flex-wrap:wrap}

const P=o=>({old:0,stock:3,mode:'pronta',featured:false,variants:[],images:[],inspired:'',longevity:'',rank:0,isNew:false,created:Date.now(),...o});
const SEED_PRODUCTS=[
  P({id:'supremacy',name:'Afnan Supremacy Collector’s Edition 100ml',cat:'arabes',price:540,stock:4,rank:1,featured:true,img:'img/supremacy.jpg',inspired:'Creed Aventus Absolu',longevity:'+10h',desc:'Frutado adocicado com cítricos, anis elegante e couro bem encaixado. Elegante, versátil e com ótima presença.'}),
  P({id:'vulcan-feu',name:'French Avenue Vulcan Feu 100ml',cat:'arabes',price:390,stock:3,rank:2,featured:true,img:'img/vulcan-feu.jpg',inspired:'Stéphane Humbert Lucas God of Fire',longevity:'+9h',desc:'Frutado tropical e adocicado com manga, gengibre, pimenta e fava tonka. Vibrante, sofisticado e nada enjoativo.'}),
  P({id:'rayhaan-elixir',name:'Rayhaan Elixir 100ml',cat:'arabes',price:320,stock:5,rank:3,img:'img/rayhaan-elixir.jpg',inspired:'Jean Paul Gaultier Le Male Elixir',longevity:'+8h30',desc:'Baunilha cremosa com hortelã, benjoim e fava tonka amendoada. Sedutor e perfeito para noites e ocasiões especiais.'}),

];
const SEED_SETTINGS={store:'NF Store',whatsapp:'',instagram:'nf.store_',pix:5,maxInst:3,city:'Rio de Janeiro',pin:'1234'};

/* ---------- Estado ---------- */
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.products)return d;}}catch(e){}return fresh();}

const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let io=null;
function reveal(nodes){if(reduceMotion()||!('IntersectionObserver' in window))return;
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{rootMargin:'0px 0px -8% 0px'});
  [...nodes].forEach((n,i)=>{const r=n.getBoundingClientRect();if(r.top<innerHeight)return;n.classList.add('rv');n.style.transitionDelay=(i%4)*70+'ms';io.observe(n);});}
function flyTo(img,target){
  target=target||$('#cBtn');if(!img||!target||reduceMotion()){target&&target.classList.remove('bump');return;}
  const a=img.getBoundingClientRect(),b=target.getBoundingClientRect();const c=document.createElement('img');c.src=img.src;c.className='fly';
  const w=Math.min(a.width,160),h=w*1.25;Object.assign(c.style,{left:a.left+(a.width-w)/2+'px',top:a.top+(a.height-h)/2+'px',width:w+'px',height:h+'px'});document.body.appendChild(c);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.12)`,opacity:.6}],{duration:650,easing:'cubic-bezier(.5,0,.2,1)'}).onfinish=()=>{c.remove();target.classList.remove('bump');void target.offsetWidth;target.classList.add('bump');};}

function setCat(c){view.cat=c;app.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat===c));renderGrid();}
function renderGrid(){
  const q=view.q.trim().toLowerCase();
  let list=S.products.filter(p=>(view.cat==='todos'||(view.cat==='novos'?p.isNew:p.cat===view.cat))&&(!q||(p.name+' '+catName(p.cat)+' '+(p.inspired||'')).toLowerCase().includes(q)));
  const av=p=>canBuy(p)?0:1;
  const so={destaque:(a,b)=>av(a)-av(b)||(b.featured-a.featured)||((a.rank||99)-(b.rank||99)),menor:(a,b)=>a.price-b.price,maior:(a,b)=>b.price-a.price,nome:(a,b)=>a.name.localeCompare(b.name)};
  list.sort(so[view.sort]);
  const g=$('#grid');if(!g)return;
  g.innerHTML=list.length?list.map(p=>{const si=stockInfo(p);const off=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
    const badge=p.mode==='encomenda'?'<span class="badge dark">Sob encomenda</span>':p.stock<=0?'<span class="badge dark">Esgotado</span>':p.isNew?'<span class="badge">Lançamento</span>':p.stock<=2?`<span class="badge">${si.txt}</span>`:'';
    return `<a class="card ${canBuy(p)?'':'isout'}" href="#p-${p.id}"><div class="ph"><img src="${img0(p)}" alt="${esc(p.name)}" loading="lazy">${badge}${off?`<span class="badge sale num">−${off}%</span>`:''}
      ${canBuy(p)&&!p.variants.length?`<button class="quick" data-quick="${p.id}" type="button">Adicionar à sacola</button>`:''}</div>
      <div><div class="spec">${esc(specOf(p))}</div><div class="nm" style="margin-top:4px">${esc(p.name)}</div><div class="sub">${p.inspired?'Inspirado em '+esc(p.inspired):esc(catName(p.cat))}</div></div>${priceBlock(p)}</a>`;}).join('')
    :`<p class="empty">Nada encontrado para essa busca. Tente outro nome ou categoria.</p>`;
  g.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();addToCart(b.dataset.quick,1,'');flyTo(b.closest('.ph').querySelector('img'));toast('Adicionado à sacola');refreshCounts();}));
  reveal(g.querySelectorAll('.card'));
}

function addToCart(id,n,v){const p=S.products.find(x=>x.id===id);const k=id+'::'+(v||'');S.cart[k]=Math.min(maxQ(p),(S.cart[k]||0)+n);save();}
function cartLines(){return Object.entries(S.cart).map(([k,q])=>{const [id,v]=k.split('::');return {k,p:S.products.find(x=>x.id===id),v,q};}).filter(l=>l.p&&l.q>0);}

          <label><input type="radio" name="pag" value="cartao" ${ck.pagamento==='cartao'?'checked':''}><span>Cartão ${S.settings.maxInst}x</span></label>
          <label><input type="radio" name="pag" value="dinheiro" ${ck.pagamento==='dinheiro'?'checked':''}><span>Dinheiro</span></label></div></div>
        <div class="field"><label for="ck-obs">Observação</label><textarea id="ck-obs" rows="2" placeholder="Opcional">${esc(ck.obs)}</textarea></div>
        <div class="field"><label>Mensagem que será enviada</label><div class="msgbox" id="msgPrev"></div></div></form>`;
      foot.innerHTML=totals+`<a class="btn btn-wa" id="sendWa" href="#" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
        <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" id="backCart" style="flex:1">Voltar à sacola</button><button class="btn btn-ghost btn-sm" id="copyMsg" style="flex:1">Copiar mensagem</button></div>
        ${S.settings.whatsapp?'':'<span class="note">Demonstração: o número da loja ainda não foi configurado, então o WhatsApp vai pedir para escolher o contato</span>'}`;
      const f=$('#ckf');
      const upd=()=>{ck.nome=$('#ck-nome').value;ck.endereco=$('#ck-end').value;ck.obs=$('#ck-obs').value;ck.entrega=f.querySelector('[name=entrega]:checked').value;ck.pagamento=f.querySelector('[name=pag]:checked').value;$('#endf').hidden=ck.entrega!=='entrega';const m=buildMsg();$('#msgPrev').textContent=m;$('#sendWa').href=waLink(m);};
      f.addEventListener('input',upd);
      f.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>{upd();draw();}));
      f.addEventListener('submit',e=>e.preventDefault());
      upd();
      $('#backCart').onclick=()=>{step='cart';draw();};
      $('#copyMsg').onclick=()=>{const m=buildMsg();(navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).then(()=>toast('Mensagem copiada'),()=>{const r=document.createRange();r.selectNodeContents($('#msgPrev'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selecione e copie a mensagem');});};
      $('#sendWa').addEventListener('click',e=>{
        if(!ck.nome.trim()){e.preventDefault();$('#ck-nome').focus();toast('Informe seu nome para enviar o pedido');return;}
        S.orders.unshift({id:Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),name:ck.nome,entrega:ck.entrega,endereco:ck.endereco,pagamento:ck.pagamento,items:lines.map(l=>({id:l.p.id,name:l.p.name+(l.v?` (${l.v})`:''),q:l.q,price:l.p.price})),total,status:'novo'});
        S.cart={};save();refreshCounts();setTimeout(()=>{closeOverlay();toast('Pedido enviado para o WhatsApp da loja');},300);
      });
    }
    body.querySelectorAll('[data-inc],[data-dec],[data-rm]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.inc||b.dataset.dec||b.dataset.rm;const p=S.products.find(x=>x.id===k.split('::')[0]);
      if(b.dataset.inc)S.cart[k]=Math.min(maxQ(p),S.cart[k]+1);if(b.dataset.dec)S.cart[k]=Math.max(0,S.cart[k]-1);if(b.dataset.rm||!S.cart[k])delete S.cart[k];
      save();refreshCounts();draw();});
  };
  draw();
}
function buildMsg(){
  const lines=cartLines();const sub=lines.reduce((a,l)=>a+l.p.price*l.q,0);
  const pay={pix:`Pix (${S.settings.pix}% de desconto)`,cartao:`Cartão em até ${S.settings.maxInst}x`,dinheiro:'Dinheiro'}[ck.pagamento];
  const total=ck.pagamento==='pix'?pixPrice(sub):sub;
  return `Olá, ${S.settings.store}! Quero fazer este pedido pelo site:\n\n`+lines.map(l=>`• ${l.q}x ${l.p.name}${l.v?` (${l.v})`:''}${l.p.mode==='encomenda'?' [encomenda]':''} = ${brl(l.p.price*l.q)}`).join('\n')+
  `\n\nSubtotal: ${brl(sub)}\nPagamento: ${pay}\nTotal: ${brl(total)}\n\nNome: ${ck.nome||'-'}\nRecebimento: ${ck.entrega==='retirada'?'Retirada na loja':'Entrega em '+(ck.endereco||'(informar)')}`+(ck.obs?`\nObs.: ${ck.obs}`:'');
}

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

let lastWasStore=false,afterClose=null;
function route(){
  const h=location.hash.slice(1);
  if(h==='admin'){lastWasStore=false;renderAdmin();window.scrollTo(0,0);return;}
  if(!lastWasStore){renderStore();lastWasStore=true;}
  if(h.startsWith('p-'))openProduct(h.slice(2));else{closeOverlay();if(afterClose){const f=afterClose;afterClose=null;f();}}
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay')){if(location.hash.startsWith('#p-'))location.hash='';else closeOverlay();}});
route();
})();
</script>
